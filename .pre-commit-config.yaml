repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run through the project's own uv-managed venv rather than an
        # isolated pre-commit env, so it sees the same click/structlog/
        # polars types the dev env has instead of duplicating pins here.
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
